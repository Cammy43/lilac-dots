    [shell.animation]
    speed = 0.65000000968575478

    [shell.launcher]
    app_grid = true
    compact = true

        [shell.launcher.providers.calculator]
        prefix = ""

        [shell.launcher.providers.emoji]
        prefix = ""

    [shell.panel]
    floating_layer = "top"
    transparency_mode = "glass"

    [shell.screenshot]
    show_cursor = true

    [[shell.session.actions]]
    action = "command"
    command = "hyprlock"
    countdown_seconds = 0.0
    enabled = true
    glyph = "lock"
    label = "Lock"
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "suspend"
    command = "systemctl suspend-then-hibernate"
    countdown_seconds = 0.0
    enabled = true
    glyph = "moon-stars"
    label = "Sleep"
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

    [shell.shadow]
    alpha = 0.74999998323619366
